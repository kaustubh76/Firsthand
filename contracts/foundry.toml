[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
gas_reports = ["SplitMath", "MerkleLib", "PassportLib", "P256"]
# Vector-driven tests read the shared golden JSON.
fs_permissions = [
  { access = "read", path = "../packages/test-vectors/vectors" },
  { access = "read-write", path = "../deployments" },
]
ffi = false

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

# CI: heavy fuzzing and invariants (README §18 gate).
[profile.ci]
fuzz = { runs = 10000, max_test_rejects = 262144 }
invariant = { runs = 512, depth = 64, fail_on_revert = false }

# Coverage disables the optimizer so line mapping is exact; only src/libraries is gated.
[profile.coverage]
optimizer = false
via_ir = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
anvil = "http://127.0.0.1:8545"
