name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: lint · deps · build · typecheck · coverage · vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.1.0
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm lint
      - name: Dependency graph (privacy boundary)
        run: pnpm check:deps
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage gates
        run: pnpm coverage
      - name: Golden vectors are up to date
        run: pnpm vectors:check

  forge:
    name: forge fmt · test (ci profile) · coverage gate · deploy dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.1.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
      - name: Coverage gate on src/libraries (>= 95%)
        run: |
          FOUNDRY_PROFILE=coverage forge coverage --report lcov --report-file lcov.info --no-match-coverage '(test|script)'
          node ../scripts/coverage-gate.mjs --lcov lcov.info --min 95 --include src/libraries/
      - name: Deploy dry-run on anvil
        run: |
          anvil --silent --port 8545 &
          sleep 2
          DEPLOYER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
          USDC_ADDRESS=0x0000000000000000000000000000000000000dc0 \
          forge script script/Deploy.s.sol --rpc-url http://127.0.0.1:8545 --broadcast
